<!doctype html>
<html lang="en" data-theme="chrome">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#040506" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MANAS-ONE811</title>
  <meta name="description" content="NEXUS is your personal operating system for goals, work, wellness, money, memories, and a shared future." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link id="fontLink" rel="stylesheet" href="" />
  <link rel="stylesheet" href="themes.css" />
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="worlds.css" />
</head>
<body>
  <!-- Living background: a canvas of drifting particles that reacts to touch -->
  <canvas id="aura" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--a1)" stop-opacity=".5"/><stop offset="1" stop-color="var(--a1)" stop-opacity="0"/></linearGradient></defs></svg>

  <!-- Boot sequence shown once per launch -->
  <div id="boot"></div>

  <!-- Top strip: identity, clock, search -->
  <header class="strip">
    <button id="sigil" class="sigil" aria-label="Home"><span></span><span></span><span></span></button>
    <div class="strip-title"><div id="screenTitle" class="display">Command</div><div id="clock" class="mono dim"></div></div>
    
    <button id="worldsTop" class="ghost-ico" aria-label="All worlds" title="All worlds">❖</button>
    <button id="quickTop" class="ghost-ico" aria-label="Quick add" title="Quick add">＋</button>
    <button id="searchBtn" class="ghost-ico" aria-label="Search" title="Search">⌕</button>
  </header>

    <!-- ORBIT navigation: a rotating ring of modules around a core button -->
  <nav id="orbit" aria-label="Navigation">
    <div class="orbit-ring" id="orbitRing"></div>
    <button id="core" class="core" aria-label="Open navigation"><i></i></button>
    <button id="quick" class="quick" aria-label="Quick add">+</button>
  </nav>
  <div id="orbitVeil"></div>
  <main id="view" tabindex="-1"></main>


  <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-hidden="true" inert><div class="sheet-body" id="sheetBody"></div></div>
  <div id="toast"></div>

  <script src="store.js"></script>
  <script src="policy.js"></script>
  <script src="vault.js"></script>
  <script src="api.js"></script>
  <script src="fx.js"></script>
  <script src="ui.js"></script>
  <script src="modules.js"></script>
  <script src="dashboard.js"></script>
  <script src="ourworld.js"></script>
  <script src="experiences.js"></script>
  <script src="worlds.js"></script>
  <script src="app.js"></script>
  <script src="droid.js"></script>
</body>
</html>
